name = "vq"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

# Dense matrices over an arbitrary coefficient ring from the Lean FRO.
# `hex-matrix` uses Lean core and has an Apache-2.0 license.  `mul` and
# `dotProduct` are `List.finRange` folds because core `Fin.foldl` does not
# reduce in the kernel.
# The pin fixes the dependency source revision.
[[require]]
name = "hex-matrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "d45bf749d6283726b8df43b5be9e6dde350666d6"

[[lean_lib]]
name = "VQ"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[lean_lib]]
name = "VQMathlib"

[[lean_lib]]
name = "VQBridge"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
